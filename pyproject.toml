[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clipring"
dynamic = ["version"]
description = "Cross-platform clipboard input engine, multi-format event watcher, and automated image extractor"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Guan Zheng Huang" }]
maintainers = [{ name = "CoronRing" }]
keywords = [
    "clipboard",
    "clipboard-input",
    "clipboard-watcher",
    "clipboard-manager",
    "image-autosaver",
    "webp",
    "event-driven",
    "cross-platform",
    "windows",
    "macos",
    "input-mechanism",
    "automation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: Capture",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
    "Typing :: Typed",
]

# Core dependencies remain lightweight so importing clipring is near-instant
dependencies = [
    "pillow>=10.0.0",
    "pyperclip>=1.8.2",
    "rich>=13.0.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
ai = [
    "openai>=1.30.0",
]
hardware = [
    "pycaw>=20240210; sys_platform == 'win32'",
]
all = [
    "clipring[ai,hardware]",
]
dev = [
    "clipring[all]",
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.6",
    "mypy>=1.11",
    "build>=1.0",
]

[project.scripts]
clipring = "clipring.cli.main:app"
clip = "clipring.cli.main:app"

[project.urls]
Homepage = "https://github.com/CoronRing/clipring"
Repository = "https://github.com/CoronRing/clipring"
Issues = "https://github.com/CoronRing/clipring/issues"
Changelog = "https://github.com/CoronRing/clipring/blob/main/CHANGELOG.md"
Documentation = "https://github.com/CoronRing/clipring/tree/main/docs"
Security = "https://github.com/CoronRing/clipring/blob/main/SECURITY.md"

[tool.hatch.version]
path = "src/clipring/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/clipring"]

[tool.hatch.build.targets.sdist]
include = [
    "src/clipring",
    "tests",
    "docs",
    "examples",
    "README.md",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "CODE_OF_CONDUCT.md",
    "SECURITY.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.pytest.ini_options]
minversion = "7.4"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
markers = [
    "integration: runs with real OS clipboard (deselect with -m 'not integration')",
    "ai: tests requiring AI endpoints (deselect with -m 'not ai')",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",   # line length formatted by formatter
    "B008",   # function calls in typer defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "SIM117"]
"examples/*" = ["N806"]

[tool.mypy]
python_version = "3.10"
files = ["src/clipring"]
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.coverage.run]
source = ["clipring"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
